  /hr/assignments:
    get:
      operationId: getAssignments
      summary: Retrieve Employee Assignments
      description: Retrieves employee assignment records. Maps to the PER_ALL_ASSIGNMENTS_F table through the HR_ASSIGNMENT_API package.
      tags:
      - Employee Management
      security:
      - tokenAuth: []
      - basicAuth: []
      parameters:
      - name: assignmentId
        in: query
        description: Assignment identifier
        schema:
          type: integer
        example: '500123'
      - name: personId
        in: query
        description: Person identifier
        schema:
          type: integer
        example: '500123'
      - name: organizationId
        in: query
        description: HR organization identifier
        schema:
          type: integer
        example: '500123'
      - name: effectiveDate
        in: query
        description: Effective date (YYYY-MM-DD)
        schema:
          type: string
          format: date
        example: '2026-01-15'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
                  totalCount:
                    type: integer
                  hasMore:
                    type: boolean
              examples:
                Getassignments200Example:
                  summary: Default getAssignments 200 response
                  x-microcks-default: true
                  value:
                    items:
                    - assignmentId: '500123'
                      assignmentNumber: example_value
                      assignmentType: E
                      primaryFlag: Y
                      jobId: '500123'
                      jobName: example_value
                      positionId: '500123'
                      positionName: example_value
                      gradeId: '500123'
                      gradeName: example_value
                      organizationId: '500123'
                      organizationName: example_value
                      locationId: '500123'
                      locationCode: example_value
                      supervisorId: '500123'
                      payrollId: '500123'
                      employmentCategory: FR
                      normalHours: 42.5
                      frequency: D
                      effectiveStartDate: '2026-01-15'
                      effectiveEndDate: '2026-01-15'
                    totalCount: 10
                    hasMore: true
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    EmployeeCreate:
      type: object
      required:
      - firstName
      - lastName
      - hireDate
      - businessGroupId
      properties:
        title:
          type: string
          example: Example Title
        firstName:
          type: string
          example: example_value
        middleNames:
          type: string
          example: example_value
        lastName:
          type: string
          example: example_value
        knownAs:
          type: string
          example: example_value
        emailAddress:
          type: string
          format: email
          example: user@example.com
        sex:
          type: string
          enum:
          - M
          - F
          example: M
        dateOfBirth:
          type: string
          format: date
          example: '2026-01-15'
        nationalIdentifier:
          type: string
          example: example_value
        nationality:
          type: string
          example: example_value
        maritalStatus:
          type: string
          example: example_value
        hireDate:
          type: string
          format: date
          example: '2026-01-15'
        businessGroupId:
          type: integer
          example: '500123'
        jobId:
          type: integer
          example: '500123'
        positionId:
          type: integer
          example: '500123'
        organizationId:
          type: integer
          example: '500123'
        gradeId:
          type: integer
          example: '500123'
        locationId:
          type: integer
          example: '500123'
        payrollId:
          type: integer
          example: '500123'
    EmployeeUpdate:
      type: object
      required:
      - effectiveDate
      properties:
        effectiveDate:
          type: string
          format: date
          description: Date-track effective date for the update
          example: '2026-01-15'
        dateTrackUpdateMode:
          type: string
          description: Date-track update mode
          enum:
          - CORRECTION
          - UPDATE
          - UPDATE_CHANGE_INSERT
          - UPDATE_OVERRIDE
          default: CORRECTION
          example: CORRECTION
        title:
          type: string
          example: Example Title
        firstName:
          type: string
          example: example_value
        middleNames:
          type: string
          example: example_value
        lastName:
          type: string
          example: example_value
        knownAs:
          type: string
          example: example_value
        emailAddress:
          type: string
          format: email
          example: user@example.com
        maritalStatus:
          type: string
          example: example_value
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            detail:
              type: string
          example: example_value
    Assignment:
      type: object
      properties:
        assignmentId:
          type: integer
          description: Assignment identifier
          example: '500123'
        assignmentNumber:
          type: string
          description: Assignment number
          example: example_value
        assignmentType:
          type: string
          description: Assignment type
          enum:
          - E
          - C
          - A
          example: E
        primaryFlag:
          type: string
          description: Whether this is the primary assignment
          enum:
          - Y
          - N
          example: Y
        jobId:
          type: integer
          description: Job identifier
          example: '500123'
        jobName:
          type: string
          description: Job name
          example: example_value
        positionId:
          type: integer
          description: Position identifier
          example: '500123'
        positionName:
          type: string
          description: Position name
          example: example_value
        gradeId:
          type: integer
          description: Grade identifier
          example: '500123'
        gradeName:
          type: string
          description: Grade name
          example: example_value
        organizationId:
          type: integer
          description: Organization identifier
          example: '500123'
        organizationName:
          type: string
          description: Organization name
          example: example_value
        locationId:
          type: integer
          description: Location identifier
          example: '500123'
        locationCode:
          type: string
          description: Location code
          example: example_value
        supervisorId:
          type: integer
          description: Supervisor person identifier
          example: '500123'
        payrollId:
          type: integer
          description: Payroll identifier
          example: '500123'
        employmentCategory:
          type: string
          description: Employment category
          enum:
          - FR
          - FT
          - PR
          - PT
          example: FR
        normalHours:
          type: number
          format: double
          description: Normal working hours
          example: 42.5
        frequency:
          type: string
          description: Hours frequency
          enum:
          - D
          - W
          - M
          - Y
          example: D
        effectiveStartDate:
          type: string
          format: date
          example: '2026-01-15'
        effectiveEndDate:
          type: string
          format: date
          example: '2026-01-15'
    Phone:
      type: object
      properties:
        phoneId:
          type: integer
          example: '500123'
        phoneType:
          type: string
          description: Phone type
          enum:
          - W1
          - H1
          - M
          - WF
          - HF
          example: W1
        phoneNumber:
          type: string
          example: example_value
        dateFrom:
          type: string
          format: date
          example: '2026-01-15'
        dateTo:
          type: string
          format: date
          example: '2026-01-15'
    Address:
      type: object
      properties:
        addressId:
          type: integer
          description: Address identifier
          example: '500123'
        addressType:
          type: string
          description: Address type
          example: example_value
        addressLine1:
          type: string
          example: example_value
        addressLine2:
          type: string
          example: example_value
        addressLine3:
          type: string
          example: example_value
        townOrCity:
          type: string
          example: example_value
        region1:
          type: string
          description: County/province
          example: example_value
        region2:
          type: string
          description: State
          example: example_value
        postalCode:
          type: string
          example: example_value
        country:
          type: string
          description: Country code
          example: example_value
        primaryFlag:
          type: string
          enum:
          - Y
          - N
          example: Y
        dateFrom:
          type: string
          format: date
          example: '2026-01-15'
        dateTo:
          type: string
          format: date
          example: '2026-01-15'
    Employee:
      type: object
      properties:
        personId:
          type: integer
          description: Person identifier
          example: '500123'
        employeeNumber:
          type: string
          description: Employee number
          example: example_value
        title:
          type: string
          description: Title (Mr., Mrs., etc.)
          example: Example Title
        firstName:
          type: string
          description: First name
          example: example_value
        middleNames:
          type: string
          description: Middle name(s)
          example: example_value
        lastName:
          type: string
          description: Last name
          example: example_value
        fullName:
          type: string
          description: Full name (derived)
          example: example_value
        knownAs:
          type: string
          description: Preferred name
          example: example_value
        emailAddress:
          type: string
          format: email
          description: Email address
          example: user@example.com
        sex:
          type: string
          description: Gender
          enum:
          - M
          - F
          example: M
        dateOfBirth:
          type: string
          format: date
          description: Date of birth
          example: '2026-01-15'
        nationalIdentifier:
          type: string
          description: National identifier (e.g., SSN)
          example: example_value
        nationality:
          type: string
          description: Nationality code
          example: example_value
        maritalStatus:
          type: string
          description: Marital status
          example: example_value
        effectiveStartDate:
          type: string
          format: date
          description: Record effective start date (date-tracked)
          example: '2026-01-15'
        effectiveEndDate:
          type: string
          format: date
          description: Record effective end date (date-tracked)
          example: '2026-01-15'
        hireDate:
          type: string
          format: date
          description: Original hire date
          example: '2026-01-15'
        currentEmployeeFlag:
          type: string
          enum:
          - Y
          - N
          example: Y
        businessGroupId:
          type: integer
          description: Business group identifier
          example: '500123'
        assignment:
          $ref: '#/components/schemas/Assignment'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          example: []
        phones:
          type: array
          items:
            $ref: '#/components/schemas/Phone'
          example: []
        creationDate:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
        lastUpdateDate:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or token expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    Offset:
      name: offset
      in: query
      description: Number of records to skip for pagination
      schema:
        type: integer
        default: 0
    Limit:
      name: limit
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        default: 25
        maximum: 500
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication with Oracle EBS username and password
    tokenAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Token-based authentication using the ISG login access token
