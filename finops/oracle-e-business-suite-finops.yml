principles:
  - name: Visibility
    description: Maintain a per-module user count register; reconcile against Oracle LMS audits annually.
      For cloud-deployed EBS, use OCI Cost Analysis to track infrastructure separately from license cost.
  - name: Allocation
    description: Allocate license cost by module to the consuming business unit (Finance, HR, Procurement,
      etc.); allocate cloud infra by environment (Prod, Test, DR).
  - name: Optimization
    description: Reclaim inactive user accounts before each true-up; consolidate non-prod environments;
      use BYOL on OCI for the EBS-supporting Database; consider Oracle Fusion Cloud as a long-term replacement
      where the modernization business case fits.
  - name: Accountability
    description: A named EBS license owner reconciles the user catalog; CFO / IT Finance own the annual
      Oracle support renewal and license true-up.
