naftiko: 1.0.0-alpha2
info:
  label: Oracle EBS Supply Chain Management API — Order Management
  description: 'Oracle EBS Supply Chain Management API — Order Management. 2 operations. Lead operation: Retrieve Sales Orders.
    Self-contained Naftiko capability covering one Oracle E Business Suite business surface.'
  tags:
  - Oracle E Business Suite
  - Order Management
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_E_BUSINESS_SUITE_API_KEY: ORACLE_E_BUSINESS_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: supply-chain-order-management
    baseUri: https://{instance}.oracle.com/webservices/rest
    description: Oracle EBS Supply Chain Management API — Order Management business capability. Self-contained, no shared
      references.
    resources:
    - name: oe-salesOrders
      path: /oe/salesOrders
      operations:
      - name: getsalesorders
        method: GET
        description: Retrieve Sales Orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: headerId
          in: query
          type: integer
          description: Order header identifier
        - name: orderNumber
          in: query
          type: integer
          description: Order number
        - name: customerId
          in: query
          type: integer
          description: Customer identifier (sold-to)
        - name: flowStatusCode
          in: query
          type: string
          description: Order flow status
        - name: orderedDateFrom
          in: query
          type: string
          description: Order date range start (YYYY-MM-DD)
        - name: orderedDateTo
          in: query
          type: string
          description: Order date range end (YYYY-MM-DD)
      - name: createsalesorder
        method: POST
        description: Create a Sales Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: accessToken
      value: '{{env.ORACLE_E_BUSINESS_SUITE_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: supply-chain-order-management-rest
    port: 8080
    description: REST adapter for Oracle EBS Supply Chain Management API — Order Management. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/oe/salesorders
      name: oe-salesorders
      description: REST surface for oe-salesOrders.
      operations:
      - method: GET
        name: getsalesorders
        description: Retrieve Sales Orders
        call: supply-chain-order-management.getsalesorders
        with:
          headerId: rest.headerId
          orderNumber: rest.orderNumber
          customerId: rest.customerId
          flowStatusCode: rest.flowStatusCode
          orderedDateFrom: rest.orderedDateFrom
          orderedDateTo: rest.orderedDateTo
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createsalesorder
        description: Create a Sales Order
        call: supply-chain-order-management.createsalesorder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: supply-chain-order-management-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle EBS Supply Chain Management API — Order Management. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: retrieve-sales-orders
      description: Retrieve Sales Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: supply-chain-order-management.getsalesorders
      with:
        headerId: tools.headerId
        orderNumber: tools.orderNumber
        customerId: tools.customerId
        flowStatusCode: tools.flowStatusCode
        orderedDateFrom: tools.orderedDateFrom
        orderedDateTo: tools.orderedDateTo
      outputParameters:
      - type: object
        mapping: $.
    - name: create-sales-order
      description: Create a Sales Order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: supply-chain-order-management.createsalesorder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
