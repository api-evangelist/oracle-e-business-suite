naftiko: 1.0.0-alpha2
info:
  label: Oracle EBS Manufacturing Operations
  description: Manufacturing execution combining BOMs, routings, discrete jobs, WIP operations, and inventory management.
    Used by production managers and shop floor supervisors for manufacturing lifecycle.
  tags:
  - Oracle
  - Manufacturing
  - Supply Chain
  - Production
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    ORACLE_EBS_TOKEN: ORACLE_EBS_TOKEN
capability:
  consumes:
  - type: http
    namespace: oracle-manufacturing
    baseUri: https://{instance}.oracle.com/webservices/rest
    description: Oracle EBS Manufacturing API for managing production operations.
    authentication:
      type: bearer
      token: '{{ORACLE_EBS_TOKEN}}'
    resources:
    - name: bills-of-material
      path: /bom/bills
      description: Bills of Material.
      operations:
      - name: get-bills-of-material
        method: GET
        description: Retrieve bills of material.
        inputParameters:
        - name: organizationId
          in: query
          type: integer
          required: false
          description: Organization identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: bill-of-material
      path: /bom/bills/{billSequenceId}
      description: Specific bill of material.
      operations:
      - name: get-bill-of-material-by-id
        method: GET
        description: Get bill of material by ID.
        inputParameters:
        - name: billSequenceId
          in: path
          type: integer
          required: true
          description: Bill sequence identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: routings
      path: /bom/routings
      description: Manufacturing routings.
      operations:
      - name: get-routings
        method: GET
        description: Retrieve routings.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: discrete-jobs
      path: /wip/discrete-jobs
      description: Discrete manufacturing jobs.
      operations:
      - name: get-discrete-jobs
        method: GET
        description: Retrieve discrete jobs.
        inputParameters:
        - name: organizationId
          in: query
          type: integer
          required: false
          description: Organization identifier.
        - name: status
          in: query
          type: string
          required: false
          description: Job status.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-discrete-job
        method: POST
        description: Create a discrete job.
        body:
          type: json
          data:
            organizationId: '{{tools.organization_id}}'
            assemblyItemId: '{{tools.assembly_item_id}}'
            startQuantity: '{{tools.start_quantity}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: discrete-job
      path: /wip/discrete-jobs/{wipEntityId}
      description: Specific discrete job.
      operations:
      - name: get-discrete-job-by-id
        method: GET
        description: Get discrete job by ID.
        inputParameters:
        - name: wipEntityId
          in: path
          type: integer
          required: true
          description: WIP entity identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: wip-operations
      path: /wip/operations
      description: WIP operations.
      operations:
      - name: get-wip-operations
        method: GET
        description: Retrieve WIP operations.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: assembly-completion
      path: /wip/completions
      description: Assembly completions.
      operations:
      - name: complete-assembly
        method: POST
        description: Complete an assembly.
        body:
          type: json
          data:
            wipEntityId: '{{tools.wip_entity_id}}'
            quantity: '{{tools.quantity}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: material-issues
      path: /wip/material-issues
      description: Material issue transactions.
      operations:
      - name: issue-material
        method: POST
        description: Issue material to a job.
        body:
          type: json
          data:
            wipEntityId: '{{tools.wip_entity_id}}'
            inventoryItemId: '{{tools.inventory_item_id}}'
            quantity: '{{tools.quantity}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: oracle-supply-chain
    baseUri: https://{instance}.oracle.com/webservices/rest
    description: Oracle EBS Supply Chain API for managing procurement and inventory.
    authentication:
      type: bearer
      token: '{{ORACLE_EBS_TOKEN}}'
    resources:
    - name: purchase-orders
      path: /po/purchase-orders
      description: Purchase order management.
      operations:
      - name: get-purchase-orders
        method: GET
        description: Retrieve purchase orders.
        inputParameters:
        - name: vendorId
          in: query
          type: integer
          required: false
          description: Vendor identifier.
        - name: status
          in: query
          type: string
          required: false
          description: PO status.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-purchase-order
        method: POST
        description: Create a purchase order.
        body:
          type: json
          data:
            vendorId: '{{tools.vendor_id}}'
            lines: '{{tools.lines}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: purchase-order
      path: /po/purchase-orders/{poHeaderId}
      description: Specific purchase order.
      operations:
      - name: get-purchase-order-by-id
        method: GET
        description: Get purchase order by ID.
        inputParameters:
        - name: poHeaderId
          in: path
          type: integer
          required: true
          description: PO header identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-purchase-order
        method: PUT
        description: Update a purchase order.
        inputParameters:
        - name: poHeaderId
          in: path
          type: integer
          required: true
          description: PO header identifier.
        body:
          type: json
          data:
            status: '{{tools.status}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: requisitions
      path: /po/requisitions
      description: Purchase requisitions.
      operations:
      - name: get-requisitions
        method: GET
        description: Retrieve requisitions.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: suppliers
      path: /po/suppliers
      description: Supplier management.
      operations:
      - name: get-suppliers
        method: GET
        description: Retrieve suppliers.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sales-orders
      path: /oe/sales-orders
      description: Sales order management.
      operations:
      - name: get-sales-orders
        method: GET
        description: Retrieve sales orders.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-sales-order
        method: POST
        description: Create a sales order.
        body:
          type: json
          data:
            customerId: '{{tools.customer_id}}'
            lines: '{{tools.lines}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: inventory-items
      path: /inv/items
      description: Inventory items.
      operations:
      - name: get-inventory-items
        method: GET
        description: Retrieve inventory items.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: onhand-quantities
      path: /inv/onhand
      description: On-hand inventory quantities.
      operations:
      - name: get-onhand-quantities
        method: GET
        description: Retrieve on-hand quantities.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: deliveries
      path: /wsh/deliveries
      description: Shipping deliveries.
      operations:
      - name: get-deliveries
        method: GET
        description: Retrieve deliveries.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8082
    namespace: manufacturing-operations-api
    description: Unified REST API for Oracle EBS manufacturing operations.
    resources:
    - path: /v1/bills-of-material
      name: bills-of-material
      description: BOM management.
      operations:
      - method: GET
        name: get-bills-of-material
        description: List BOMs.
        call: oracle-manufacturing.get-bills-of-material
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/discrete-jobs
      name: discrete-jobs
      description: Discrete job management.
      operations:
      - method: GET
        name: get-discrete-jobs
        description: List discrete jobs.
        call: oracle-manufacturing.get-discrete-jobs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/inventory-items
      name: inventory-items
      description: Inventory item management.
      operations:
      - method: GET
        name: get-inventory-items
        description: List inventory items.
        call: oracle-supply-chain.get-inventory-items
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/onhand-quantities
      name: onhand-quantities
      description: On-hand quantity management.
      operations:
      - method: GET
        name: get-onhand-quantities
        description: List on-hand quantities.
        call: oracle-supply-chain.get-onhand-quantities
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9082
    namespace: manufacturing-operations-mcp
    transport: http
    description: MCP server for AI-assisted Oracle EBS manufacturing operations.
    tools:
    - name: mfg-get-bills-of-material
      description: Retrieve bills of material.
      hints:
        readOnly: true
        openWorld: true
      call: oracle-manufacturing.get-bills-of-material
      outputParameters:
      - type: object
        mapping: $.
    - name: mfg-get-bill-of-material-by-id
      description: Get BOM by ID.
      hints:
        readOnly: true
      call: oracle-manufacturing.get-bill-of-material-by-id
      with:
        billSequenceId: tools.bill_sequence_id
      outputParameters:
      - type: object
        mapping: $.
    - name: mfg-get-routings
      description: Retrieve routings.
      hints:
        readOnly: true
      call: oracle-manufacturing.get-routings
      outputParameters:
      - type: object
        mapping: $.
    - name: mfg-get-discrete-jobs
      description: Retrieve discrete jobs.
      hints:
        readOnly: true
      call: oracle-manufacturing.get-discrete-jobs
      outputParameters:
      - type: object
        mapping: $.
    - name: mfg-create-discrete-job
      description: Create a discrete job.
      hints:
        readOnly: false
      call: oracle-manufacturing.create-discrete-job
      outputParameters:
      - type: object
        mapping: $.
    - name: mfg-get-discrete-job-by-id
      description: Get discrete job by ID.
      hints:
        readOnly: true
      call: oracle-manufacturing.get-discrete-job-by-id
      with:
        wipEntityId: tools.wip_entity_id
      outputParameters:
      - type: object
        mapping: $.
    - name: mfg-get-wip-operations
      description: Retrieve WIP operations.
      hints:
        readOnly: true
      call: oracle-manufacturing.get-wip-operations
      outputParameters:
      - type: object
        mapping: $.
    - name: mfg-complete-assembly
      description: Complete an assembly.
      hints:
        readOnly: false
      call: oracle-manufacturing.complete-assembly
      outputParameters:
      - type: object
        mapping: $.
    - name: mfg-issue-material
      description: Issue material to a job.
      hints:
        readOnly: false
      call: oracle-manufacturing.issue-material
      outputParameters:
      - type: object
        mapping: $.
    - name: inv-get-inventory-items
      description: Retrieve inventory items.
      hints:
        readOnly: true
      call: oracle-supply-chain.get-inventory-items
      outputParameters:
      - type: object
        mapping: $.
    - name: inv-get-onhand-quantities
      description: Retrieve on-hand quantities.
      hints:
        readOnly: true
      call: oracle-supply-chain.get-onhand-quantities
      outputParameters:
      - type: object
        mapping: $.
    - name: inv-get-sales-orders
      description: Retrieve sales orders.
      hints:
        readOnly: true
      call: oracle-supply-chain.get-sales-orders
      outputParameters:
      - type: object
        mapping: $.
    - name: inv-get-deliveries
      description: Retrieve deliveries.
      hints:
        readOnly: true
      call: oracle-supply-chain.get-deliveries
      outputParameters:
      - type: object
        mapping: $.
