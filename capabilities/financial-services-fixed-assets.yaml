naftiko: 1.0.0-alpha2
info:
  label: Oracle EBS Financial Services API — Fixed Assets
  description: 'Oracle EBS Financial Services API — Fixed Assets. 1 operations. Lead operation: Retrieve Fixed Assets. Self-contained
    Naftiko capability covering one Oracle E Business Suite business surface.'
  tags:
  - Oracle E Business Suite
  - Fixed Assets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_E_BUSINESS_SUITE_API_KEY: ORACLE_E_BUSINESS_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: financial-services-fixed-assets
    baseUri: https://{instance}.oracle.com/webservices/rest
    description: Oracle EBS Financial Services API — Fixed Assets business capability. Self-contained, no shared references.
    resources:
    - name: fa-assets
      path: /fa/assets
      operations:
      - name: getassets
        method: GET
        description: Retrieve Fixed Assets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: assetId
          in: query
          type: integer
          description: Asset identifier
        - name: assetNumber
          in: query
          type: string
          description: Asset number
        - name: assetCategory
          in: query
          type: string
          description: Asset category
    authentication:
      type: apikey
      key: accessToken
      value: '{{env.ORACLE_E_BUSINESS_SUITE_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: financial-services-fixed-assets-rest
    port: 8080
    description: REST adapter for Oracle EBS Financial Services API — Fixed Assets. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/fa/assets
      name: fa-assets
      description: REST surface for fa-assets.
      operations:
      - method: GET
        name: getassets
        description: Retrieve Fixed Assets
        call: financial-services-fixed-assets.getassets
        with:
          assetId: rest.assetId
          assetNumber: rest.assetNumber
          assetCategory: rest.assetCategory
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: financial-services-fixed-assets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle EBS Financial Services API — Fixed Assets. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: retrieve-fixed-assets
      description: Retrieve Fixed Assets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: financial-services-fixed-assets.getassets
      with:
        assetId: tools.assetId
        assetNumber: tools.assetNumber
        assetCategory: tools.assetCategory
      outputParameters:
      - type: object
        mapping: $.
