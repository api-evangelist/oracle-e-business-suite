naftiko: 1.0.0-alpha2
info:
  label: Oracle EBS e-Commerce Gateway API — Code Conversions
  description: 'Oracle EBS e-Commerce Gateway API — Code Conversions. 1 operations. Lead operation: Retrieve Code Conversion
    Mappings. Self-contained Naftiko capability covering one Oracle E Business Suite business surface.'
  tags:
  - Oracle E Business Suite
  - Code Conversions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ORACLE_E_BUSINESS_SUITE_API_KEY: ORACLE_E_BUSINESS_SUITE_API_KEY
capability:
  consumes:
  - type: http
    namespace: ecommerce-gateway-code-conversions
    baseUri: https://{instance}.oracle.com/webservices/rest
    description: Oracle EBS e-Commerce Gateway API — Code Conversions business capability. Self-contained, no shared references.
    resources:
    - name: ece-codeConversions
      path: /ece/codeConversions
      operations:
      - name: getcodeconversions
        method: GET
        description: Retrieve Code Conversion Mappings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tradingPartnerId
          in: query
          type: integer
          description: Trading partner identifier
        - name: transactionType
          in: query
          type: string
          description: Transaction type code
        - name: codeCategory
          in: query
          type: string
          description: Code category
    authentication:
      type: apikey
      key: accessToken
      value: '{{env.ORACLE_E_BUSINESS_SUITE_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: ecommerce-gateway-code-conversions-rest
    port: 8080
    description: REST adapter for Oracle EBS e-Commerce Gateway API — Code Conversions. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/ece/codeconversions
      name: ece-codeconversions
      description: REST surface for ece-codeConversions.
      operations:
      - method: GET
        name: getcodeconversions
        description: Retrieve Code Conversion Mappings
        call: ecommerce-gateway-code-conversions.getcodeconversions
        with:
          tradingPartnerId: rest.tradingPartnerId
          transactionType: rest.transactionType
          codeCategory: rest.codeCategory
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ecommerce-gateway-code-conversions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Oracle EBS e-Commerce Gateway API — Code Conversions. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: retrieve-code-conversion-mappings
      description: Retrieve Code Conversion Mappings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ecommerce-gateway-code-conversions.getcodeconversions
      with:
        tradingPartnerId: tools.tradingPartnerId
        transactionType: tools.transactionType
        codeCategory: tools.codeCategory
      outputParameters:
      - type: object
        mapping: $.
