naftiko: 1.0.0-alpha2
info:
  label: Oracle EBS Financial Operations
  description: End-to-end financial operations combining General Ledger, AP/AR, procurement, and cash management. Used by
    finance teams and controllers for the procure-to-pay and order-to-cash cycles.
  tags:
  - Oracle
  - Financials
  - Procurement
  - ERP
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    ORACLE_EBS_TOKEN: ORACLE_EBS_TOKEN
capability:
  consumes:
  - type: http
    namespace: oracle-financial-services
    baseUri: https://{instance}.oracle.com/webservices/rest
    description: Oracle EBS Financial Services API for managing financial transactions.
    authentication:
      type: bearer
      token: '{{ORACLE_EBS_TOKEN}}'
    resources:
    - name: journals
      path: /gl/journals
      description: General Ledger journal entries.
      operations:
      - name: get-journals
        method: GET
        description: Retrieve General Ledger journal entries.
        inputParameters:
        - name: ledgerId
          in: query
          type: integer
          required: false
          description: Ledger identifier.
        - name: periodName
          in: query
          type: string
          required: false
          description: Accounting period name.
        - name: status
          in: query
          type: string
          required: false
          description: Journal status (U=Unposted, A=Approved, P=Posted).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-journal
        method: POST
        description: Create a new journal entry.
        body:
          type: json
          data:
            ledgerId: '{{tools.ledger_id}}'
            periodName: '{{tools.period_name}}'
            journalCategory: '{{tools.journal_category}}'
            lines: '{{tools.lines}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ap-invoices
      path: /ap/invoices
      description: Accounts Payable invoices.
      operations:
      - name: get-ap-invoices
        method: GET
        description: Retrieve AP invoices.
        inputParameters:
        - name: vendorId
          in: query
          type: integer
          required: false
          description: Vendor identifier.
        - name: status
          in: query
          type: string
          required: false
          description: Invoice status.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-ap-invoice
        method: POST
        description: Create an AP invoice.
        body:
          type: json
          data:
            vendorId: '{{tools.vendor_id}}'
            invoiceAmount: '{{tools.invoice_amount}}'
            invoiceDate: '{{tools.invoice_date}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ap-invoice
      path: /ap/invoices/{invoiceId}
      description: Specific AP invoice.
      operations:
      - name: get-ap-invoice-by-id
        method: GET
        description: Get AP invoice by ID.
        inputParameters:
        - name: invoiceId
          in: path
          type: integer
          required: true
          description: Invoice identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: payments
      path: /ap/payments
      description: AP payments.
      operations:
      - name: get-payments
        method: GET
        description: Retrieve payments.
        inputParameters:
        - name: vendorId
          in: query
          type: integer
          required: false
          description: Vendor identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ar-invoices
      path: /ar/invoices
      description: Accounts Receivable invoices.
      operations:
      - name: get-ar-invoices
        method: GET
        description: Retrieve AR invoices.
        inputParameters:
        - name: customerId
          in: query
          type: integer
          required: false
          description: Customer identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-ar-invoice
        method: POST
        description: Create an AR invoice.
        body:
          type: json
          data:
            customerId: '{{tools.customer_id}}'
            amount: '{{tools.amount}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: receipts
      path: /ar/receipts
      description: AR receipts.
      operations:
      - name: get-receipts
        method: GET
        description: Retrieve receipts.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: assets
      path: /fa/assets
      description: Fixed assets.
      operations:
      - name: get-assets
        method: GET
        description: Retrieve fixed assets.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: bank-accounts
      path: /ce/bank-accounts
      description: Cash management bank accounts.
      operations:
      - name: get-bank-accounts
        method: GET
        description: Retrieve bank accounts.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: oracle-supply-chain
    baseUri: https://{instance}.oracle.com/webservices/rest
    description: Oracle EBS Supply Chain API for managing procurement and inventory.
    authentication:
      type: bearer
      token: '{{ORACLE_EBS_TOKEN}}'
    resources:
    - name: purchase-orders
      path: /po/purchase-orders
      description: Purchase order management.
      operations:
      - name: get-purchase-orders
        method: GET
        description: Retrieve purchase orders.
        inputParameters:
        - name: vendorId
          in: query
          type: integer
          required: false
          description: Vendor identifier.
        - name: status
          in: query
          type: string
          required: false
          description: PO status.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-purchase-order
        method: POST
        description: Create a purchase order.
        body:
          type: json
          data:
            vendorId: '{{tools.vendor_id}}'
            lines: '{{tools.lines}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: purchase-order
      path: /po/purchase-orders/{poHeaderId}
      description: Specific purchase order.
      operations:
      - name: get-purchase-order-by-id
        method: GET
        description: Get purchase order by ID.
        inputParameters:
        - name: poHeaderId
          in: path
          type: integer
          required: true
          description: PO header identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-purchase-order
        method: PUT
        description: Update a purchase order.
        inputParameters:
        - name: poHeaderId
          in: path
          type: integer
          required: true
          description: PO header identifier.
        body:
          type: json
          data:
            status: '{{tools.status}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: requisitions
      path: /po/requisitions
      description: Purchase requisitions.
      operations:
      - name: get-requisitions
        method: GET
        description: Retrieve requisitions.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: suppliers
      path: /po/suppliers
      description: Supplier management.
      operations:
      - name: get-suppliers
        method: GET
        description: Retrieve suppliers.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sales-orders
      path: /oe/sales-orders
      description: Sales order management.
      operations:
      - name: get-sales-orders
        method: GET
        description: Retrieve sales orders.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-sales-order
        method: POST
        description: Create a sales order.
        body:
          type: json
          data:
            customerId: '{{tools.customer_id}}'
            lines: '{{tools.lines}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: inventory-items
      path: /inv/items
      description: Inventory items.
      operations:
      - name: get-inventory-items
        method: GET
        description: Retrieve inventory items.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: onhand-quantities
      path: /inv/onhand
      description: On-hand inventory quantities.
      operations:
      - name: get-onhand-quantities
        method: GET
        description: Retrieve on-hand quantities.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: deliveries
      path: /wsh/deliveries
      description: Shipping deliveries.
      operations:
      - name: get-deliveries
        method: GET
        description: Retrieve deliveries.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: financial-operations-api
    description: Unified REST API for Oracle EBS financial operations.
    resources:
    - path: /v1/journals
      name: journals
      description: Journal entry management.
      operations:
      - method: GET
        name: get-journals
        description: List journal entries.
        call: oracle-financial-services.get-journals
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ap-invoices
      name: ap-invoices
      description: AP invoice management.
      operations:
      - method: GET
        name: get-ap-invoices
        description: List AP invoices.
        call: oracle-financial-services.get-ap-invoices
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ar-invoices
      name: ar-invoices
      description: AR invoice management.
      operations:
      - method: GET
        name: get-ar-invoices
        description: List AR invoices.
        call: oracle-financial-services.get-ar-invoices
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/purchase-orders
      name: purchase-orders
      description: Purchase order management.
      operations:
      - method: GET
        name: get-purchase-orders
        description: List purchase orders.
        call: oracle-supply-chain.get-purchase-orders
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/suppliers
      name: suppliers
      description: Supplier management.
      operations:
      - method: GET
        name: get-suppliers
        description: List suppliers.
        call: oracle-supply-chain.get-suppliers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: financial-operations-mcp
    transport: http
    description: MCP server for AI-assisted Oracle EBS financial operations.
    tools:
    - name: gl-get-journals
      description: Retrieve General Ledger journal entries.
      hints:
        readOnly: true
        openWorld: true
      call: oracle-financial-services.get-journals
      outputParameters:
      - type: object
        mapping: $.
    - name: gl-create-journal
      description: Create a journal entry.
      hints:
        readOnly: false
      call: oracle-financial-services.create-journal
      outputParameters:
      - type: object
        mapping: $.
    - name: ap-get-invoices
      description: Retrieve AP invoices.
      hints:
        readOnly: true
      call: oracle-financial-services.get-ap-invoices
      outputParameters:
      - type: object
        mapping: $.
    - name: ap-create-invoice
      description: Create an AP invoice.
      hints:
        readOnly: false
      call: oracle-financial-services.create-ap-invoice
      outputParameters:
      - type: object
        mapping: $.
    - name: ap-get-invoice-by-id
      description: Get AP invoice by ID.
      hints:
        readOnly: true
      call: oracle-financial-services.get-ap-invoice-by-id
      with:
        invoiceId: tools.invoice_id
      outputParameters:
      - type: object
        mapping: $.
    - name: ap-get-payments
      description: Retrieve payments.
      hints:
        readOnly: true
      call: oracle-financial-services.get-payments
      outputParameters:
      - type: object
        mapping: $.
    - name: ar-get-invoices
      description: Retrieve AR invoices.
      hints:
        readOnly: true
      call: oracle-financial-services.get-ar-invoices
      outputParameters:
      - type: object
        mapping: $.
    - name: ar-create-invoice
      description: Create an AR invoice.
      hints:
        readOnly: false
      call: oracle-financial-services.create-ar-invoice
      outputParameters:
      - type: object
        mapping: $.
    - name: ar-get-receipts
      description: Retrieve receipts.
      hints:
        readOnly: true
      call: oracle-financial-services.get-receipts
      outputParameters:
      - type: object
        mapping: $.
    - name: fa-get-assets
      description: Retrieve fixed assets.
      hints:
        readOnly: true
      call: oracle-financial-services.get-assets
      outputParameters:
      - type: object
        mapping: $.
    - name: ce-get-bank-accounts
      description: Retrieve bank accounts.
      hints:
        readOnly: true
      call: oracle-financial-services.get-bank-accounts
      outputParameters:
      - type: object
        mapping: $.
    - name: po-get-purchase-orders
      description: Retrieve purchase orders.
      hints:
        readOnly: true
      call: oracle-supply-chain.get-purchase-orders
      outputParameters:
      - type: object
        mapping: $.
    - name: po-create-purchase-order
      description: Create a purchase order.
      hints:
        readOnly: false
      call: oracle-supply-chain.create-purchase-order
      outputParameters:
      - type: object
        mapping: $.
    - name: po-get-purchase-order-by-id
      description: Get purchase order by ID.
      hints:
        readOnly: true
      call: oracle-supply-chain.get-purchase-order-by-id
      with:
        poHeaderId: tools.po_header_id
      outputParameters:
      - type: object
        mapping: $.
    - name: po-get-requisitions
      description: Retrieve requisitions.
      hints:
        readOnly: true
      call: oracle-supply-chain.get-requisitions
      outputParameters:
      - type: object
        mapping: $.
    - name: po-get-suppliers
      description: Retrieve suppliers.
      hints:
        readOnly: true
      call: oracle-supply-chain.get-suppliers
      outputParameters:
      - type: object
        mapping: $.
