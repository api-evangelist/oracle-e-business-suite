specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Oracle E-Business Suite
providerId: oracle-e-business-suite
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - ERP
  - Business Applications
  - Oracle
  - Rate Limiting
notes: EBS is on-prem / cloud-hosted enterprise software. Throughput is bounded by underlying Oracle
  Database / WebLogic / Application Tier sizing and the Integrated SOA Gateway / REST Services configuration.
  No upstream-published per-second numeric rate limits.
description: Oracle E-Business Suite REST and SOAP throughput is governed by the underlying Oracle WebLogic
  Server thread pools, Database Resource Manager, and Integrated SOA Gateway settings. Customers tune
  these per environment. Standard 503 / 429 handling applies when fronted by a cloud gateway or load balancer.
sources:
  - https://docs.oracle.com/cd/E26401_01/doc.122/e20925.html
  - https://docs.oracle.com/cd/E26401_01/doc.122/e20963.html
responseCodes:
  throttled: 429
  unavailable: 503
  conflict: 409
limits:
  - name: WebLogic thread pool
    scope: managed-server
    metric: concurrent_threads
    limit: configured per environment
  - name: Integrated SOA Gateway services
    scope: gateway
    metric: varies
    limit: per-service WS configuration
  - name: Database Resource Manager
    scope: database/consumer-group
    metric: varies
    limit: operator-defined consumer groups
policies:
  - name: WebLogic tuning
    description: Size work managers, max threads, and JDBC connection pools to match expected concurrency.
  - name: ISG governance
    description: Use Integrated SOA Gateway (ISG) to deploy SOAP/REST services; apply admin throttling
      via Oracle API Gateway / OCI API Gateway in front of EBS.
  - name: Backoff
    description: Honor 503 / 429 from upstream gateways; for EBS-specific errors, follow application-level
      retry guidance.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
