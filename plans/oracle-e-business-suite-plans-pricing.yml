specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Oracle E-Business Suite
providerId: oracle-e-business-suite
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - ERP
  - Business Applications
  - Enterprise
  - Oracle
description: Oracle E-Business Suite (EBS) is sold as a perpetual application license with separately-licensed
  modules (Financials, Procurement, SCM, Order Management, HCM, CRM, Projects, Manufacturing, etc.) and
  per-Application-User or per-Custom-Application-Suite metrics. Per-user list prices vary widely by module
  — small business modules from a few thousand USD/user, full-stack ERP $20K-$100K+/user. Annual support
  is typically 22% of license list price. EBS itself runs on Oracle Database (separately licensed). EBS
  is also offered as a managed deployment on OCI ("EBS on OCI"). Total contract commonly ranges $25K–$1M+/year
  depending on modules, users, and implementation scope. Public list prices are documented in Oracle's
  Applications Global Price List PDF; enterprise discounting is universal.
sources:
  - https://www.oracle.com/applications/ebusiness/
  - https://www.oracle.com/nl/a/ocom/docs/corporate/pricing/applications-price-list-070574.pdf
plans:
  - id: oracle-ebs-named-user
    name: EBS Application User License
    type: subscription
    description: Per-named-user perpetual license per module. Pricing varies by module; common ERP modules
      list in the $4K–$5K per-user range, with full-suite per-user totals reaching $20K–$100K depending
      on bundle.
    entries:
      - label: Financials per Application User
        name: financials_user
        type: subscription
        metric: named_user
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: see Oracle Applications Global Price List
        userMultiplied: true
      - label: Procurement per Application User
        name: procurement_user
        type: subscription
        metric: named_user
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: see Oracle Applications Global Price List
        userMultiplied: true
      - label: Supply Chain Management per Application User
        name: scm_user
        type: subscription
        metric: named_user
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: see Oracle Applications Global Price List
        userMultiplied: true
      - label: Human Capital Management per Application User (employee record)
        name: hcm_user
        type: subscription
        metric: named_user
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: see Oracle Applications Global Price List
        userMultiplied: true
    elements:
      - name: Per-named-user perpetual license
      - name: Module-specific metric (employee, customer record, etc.)
      - name: Annual support 22%
  - id: oracle-ebs-custom-suite
    name: EBS Custom Application Suite
    type: subscription
    description: Per-Processor or aggregated user metric for custom-bundled module sets. Used by enterprises
      committing to many modules with negotiated pricing.
    entries:
      - label: Custom suite (negotiated)
        name: custom_suite
        type: subscription
        metric: processor or named_user
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales (typical contracts $100K–$1M+/year)
        userMultiplied: false
    elements:
      - name: Bundled-module pricing
      - name: Volume discounts negotiated
      - name: 22% annual support
  - id: oracle-ebs-support
    name: Annual Software Update + Support
    type: subscription
    description: Mandatory annual support fee on perpetual licenses; access to patches, upgrades, and
      tech support.
    entries:
      - label: Annual support
        name: annual_support
        type: subscription
        metric: license-year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: ~22% of license list
        userMultiplied: false
    elements:
      - name: 22% of license list per year
      - name: Required to receive patches
  - id: oracle-ebs-on-oci
    name: EBS on Oracle Cloud Infrastructure
    type: usage-based
    description: EBS deployed on OCI compute + database services. Underlying OCI compute, database, storage
      billed pay-as-you-go (or via Universal Credits); EBS application licenses still required (BYOL or
      negotiated cloud subscription).
    entries:
      - label: OCI infrastructure for EBS
        name: ebs_oci_infra
        type: metered
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see https://www.oracle.com/cloud/price-list/
        userMultiplied: false
    elements:
      - name: OCI compute, DB, storage billed separately
      - name: BYOL of EBS application licenses
      - name: Managed cloud option available
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
